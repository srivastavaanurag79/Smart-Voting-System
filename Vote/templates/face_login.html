{% extends 'layout.html' %}
{% load static %}
{% block title %}Face Sign-in{% endblock %}
{% block content %}
<div class="container" style="margin-top:2em;margin-bottom:4em;color:#111">
  <h1 class="text-center">Face Sign-in</h1>
  <p class="text-center">Look at the camera and click <em>Verify</em>.</p>

  {% csrf_token %}
  <div class="text-center">
    <video id="video" autoplay playsinline muted width="100%"
           style="max-width:420px;border-radius:10px;background:#000"></video>
    <div style="margin-top:1em">
      <button id="verify" class="btn btn-primary">Verify</button>
      <a class="btn btn-default" href="{% url 'Vote:login' %}">Use password instead</a>
    </div>
    <div id="status" style="margin-top:1em"></div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.createElement('canvas');
const statusEl = document.getElementById('status');

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
    video.srcObject = stream;
  } catch (err) {
    statusEl.innerHTML = '<span class="text-danger">Camera error: ' + err.message + '</span>';
  }
}
startCamera();

document.getElementById('verify').addEventListener('click', async () => {
  statusEl.textContent = 'Checking...';
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const body = new FormData();
  body.append('frame', canvas.toDataURL('image/jpeg', 0.8));
  const resp = await fetch("{% url 'Vote:face_login' %}", {
    method: 'POST',
    headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
    body: body,
  });
  const data = await resp.json();
  if (data.ok) {
    statusEl.innerHTML = '<span class="text-success">Welcome, ' + data.voter + '. Redirecting...</span>';
    window.location.href = data.redirect;
  } else {
    statusEl.innerHTML = '<span class="text-danger">' + data.error + '</span>';
  }
});
</script>
{% endblock %}
