{% extends 'layout.html' %}
{% load static %}
{% block title %}Face sign-in{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow center" style="max-width:520px">
    <span class="eyebrow">Convenience sign-in</span>
    <h1 class="mt-1">Face sign-in</h1>
    <p class="muted">Look at the camera and click <em>Verify</em>.</p>

    {% csrf_token %}
    <div class="card card--pad-lg mt-3">
      <div class="cam" style="max-width:360px;margin:0 auto">
        <video id="video" autoplay playsinline muted></video>
        <div class="cam__frame"></div>
      </div>
      <div class="row mt-3" style="justify-content:center">
        <button id="verify" class="btn btn--primary btn--lg">Verify face</button>
        <a class="btn btn--ghost" href="{% url 'Vote:login' %}">Use password instead</a>
      </div>
      <div id="status" class="mt-2"></div>
    </div>
  </div>
</section>

<script>
const video = document.getElementById('video');
const canvas = document.createElement('canvas');
const statusEl = document.getElementById('status');

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
    video.srcObject = stream;
  } catch (err) {
    statusEl.innerHTML = '<div class="alert alert--error">Camera error: ' + err.message + '</div>';
  }
}
startCamera();

document.getElementById('verify').addEventListener('click', async () => {
  statusEl.textContent = 'Checking...';
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const body = new FormData();
  body.append('frame', canvas.toDataURL('image/jpeg', 0.8));
  const resp = await fetch("{% url 'Vote:face_login' %}", {
    method: 'POST',
    headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
    body: body,
  });
  const data = await resp.json();
  if (data.ok) {
    statusEl.innerHTML = '<div class="alert alert--success">Welcome, ' + data.voter + '. Redirecting...</div>';
    window.location.href = data.redirect;
  } else {
    statusEl.innerHTML = '<div class="alert alert--error">' + data.error + '</div>';
  }
});
</script>
{% endblock %}
