{% extends 'layout.html' %}
{% load static %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow" style="max-width:460px">
    <div class="card card--pad-lg reveal">
      <span class="eyebrow">Voter access</span>
      <h2 class="mt-1">Log in to vote</h2>
      <p class="muted">Use the credentials issued by your election administrator.</p>

      <form method="post" action="{% url 'Vote:login' %}" class="mt-3">
        {% csrf_token %}
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block btn--lg">Log in</button>
      </form>

      <hr class="hr">
      <a class="btn btn--ghost btn--block" href="{% url 'Vote:face_login' %}">Sign in with your face</a>
      <p class="center muted mt-2" style="font-size:.85rem;margin-bottom:0">
        Demo: <span class="mono">guptaabhishek / gupta1234</span>
      </p>
    </div>
  </div>
</section>
{% endblock %}
